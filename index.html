<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Барнабас</title>
<meta name="theme-color" content="#ECEFF5">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem("barnabas_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column phone app, sticky glass header + floating glass tab bar, full-screen sheets for details, forms and support chat.
   Look: frosted glass panels over a soft colour mesh; light and dark themes (auto / forced via data-theme). */
:root{
  --bg:#ECEFF5; --fg:#12141A; --muted:#5D6470;
  --surface:rgba(255,255,255,.62); --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.8); --glass-3:rgba(255,255,255,.34);
  --bar:rgba(246,248,252,.66); --edge:rgba(255,255,255,.85); --line:rgba(22,28,45,.09); --hi:rgba(255,255,255,.9);
  --shadow:0 10px 30px -12px rgba(35,45,80,.22),0 1px 3px rgba(35,45,80,.07);
  --shadow-lg:0 18px 44px -14px rgba(35,45,80,.32),0 2px 6px rgba(35,45,80,.08);
  --accent:#F2B705; --accent-2:#FFD35A; --accent-ink:#1A1505; --accent-soft:rgba(242,183,5,.16); --accent-strong:#B98300; --hot:rgba(255,200,40,.36); --hot-edge:rgba(255,255,255,.85); --star:#E0A100;
  --open:#2459C9; --open-bg:rgba(48,104,230,.12); --booked:#13805A; --booked-bg:rgba(22,150,100,.13);
  --done:#596170; --done-bg:rgba(95,104,120,.12); --danger:#C93737; --danger-bg:rgba(215,60,60,.12);
  --blob1:rgba(255,196,40,.42); --blob2:rgba(90,140,255,.36); --blob3:rgba(255,120,175,.26); --blob4:rgba(40,205,175,.22);
  --display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px; --blur:22px;
  --mesh:radial-gradient(42rem 32rem at 8% -6%,var(--blob1),transparent 62%),radial-gradient(38rem 32rem at 104% 12%,var(--blob2),transparent 62%),radial-gradient(36rem 30rem at -6% 88%,var(--blob3),transparent 62%),radial-gradient(32rem 28rem at 100% 104%,var(--blob4),transparent 62%),var(--bg);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090B10; --fg:#EEF0F5; --muted:#9AA2B0;
  --surface:rgba(30,34,46,.56); --glass:rgba(26,30,41,.55); --glass-2:rgba(40,45,60,.72); --glass-3:rgba(255,255,255,.045);
  --bar:rgba(16,19,27,.6); --edge:rgba(255,255,255,.1); --line:rgba(255,255,255,.08); --hi:rgba(255,255,255,.07);
  --shadow:0 12px 32px -12px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 20px 48px -14px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35);
  --accent-soft:rgba(242,183,5,.15); --accent-strong:#FFC93A; --hot:rgba(242,183,5,.14); --hot-edge:rgba(242,183,5,.3); --star:#F5C33B;
  --open:#8DB2FF; --open-bg:rgba(100,150,255,.15); --booked:#5FD3A0; --booked-bg:rgba(60,200,140,.14);
  --done:#AAB1BC; --done-bg:rgba(170,180,195,.12); --danger:#FF8585; --danger-bg:rgba(255,100,100,.14);
  --blob1:rgba(242,170,20,.2); --blob2:rgba(80,110,255,.28); --blob3:rgba(160,80,255,.22); --blob4:rgba(20,190,160,.15);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090B10; --fg:#EEF0F5; --muted:#9AA2B0;
  --surface:rgba(30,34,46,.56); --glass:rgba(26,30,41,.55); --glass-2:rgba(40,45,60,.72); --glass-3:rgba(255,255,255,.045);
  --bar:rgba(16,19,27,.6); --edge:rgba(255,255,255,.1); --line:rgba(255,255,255,.08); --hi:rgba(255,255,255,.07);
  --shadow:0 12px 32px -12px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 20px 48px -14px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.35);
  --accent-soft:rgba(242,183,5,.15); --accent-strong:#FFC93A; --hot:rgba(242,183,5,.14); --hot-edge:rgba(242,183,5,.3); --star:#F5C33B;
  --open:#8DB2FF; --open-bg:rgba(100,150,255,.15); --booked:#5FD3A0; --booked-bg:rgba(60,200,140,.14);
  --done:#AAB1BC; --done-bg:rgba(170,180,195,.12); --danger:#FF8585; --danger-bg:rgba(255,100,100,.14);
  --blob1:rgba(242,170,20,.2); --blob2:rgba(80,110,255,.28); --blob3:rgba(160,80,255,.22); --blob4:rgba(20,190,160,.15);
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--fg);background:transparent;min-height:100vh;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--mesh)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
/* frosted panels: real backdrop blur only on things that float over content (bars, sheet header, toast); cards sit on the smooth mesh, so translucency alone reads as glass */
.hdr,.tabbar .wrap,.sh-hdr,.composer,.toast{-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:10px;padding-block:11px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--accent-2),var(--accent));display:inline-grid;place-items:center;box-shadow:0 4px 12px -3px rgba(242,170,5,.6),inset 0 1px 0 rgba(255,255,255,.55)}
.brand i svg{width:16px;height:16px;stroke:var(--accent-ink)}
.rolechip{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--glass-3);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.hdr .sp{flex:1}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:linear-gradient(140deg,var(--accent-2),var(--accent));color:var(--accent-ink);font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);display:grid;place-items:center;color:var(--fg);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);flex:none}
.iconbtn svg{width:19px;height:19px}

main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#app.withfab main{padding-bottom:calc(168px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2;letter-spacing:-.01em;margin:12px 0 4px;text-wrap:balance}
h2{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 10px}
.lead{color:var(--muted);margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* cards */
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;width:100%;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:15px 16px;cursor:pointer;position:relative;box-shadow:var(--shadow),inset 0 1px 0 var(--hi);transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.card:focus-visible{outline:2px solid var(--accent)}
@media (hover:hover){.card:hover,.chatrow:hover{background:var(--glass-2);box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi)}}
.card:active,.chatrow:active{transform:scale(.985)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:12.5px;font-weight:600;color:var(--muted)}
.card-title{font-size:16.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.card-meta b{color:var(--fg);font-weight:600}
.card-exec{font-size:14px;border-top:1px solid var(--line);padding-top:9px;margin-top:3px}
.card .nm{font-weight:600;font-size:16px}
.card .comment{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.price{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.s-open{color:var(--open);background:var(--open-bg);border-color:var(--open-bg)}
.s-booked{color:var(--booked);background:var(--booked-bg);border-color:var(--booked-bg)}
.s-done{color:var(--done);background:var(--done-bg);border-color:var(--done-bg)}
.s-cancel{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-bg)}
.match{align-self:flex-start;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--fg);padding:3px 9px;border-radius:8px}
.badge-ok{font-size:12px;font-weight:600;color:var(--booked)}
.badge-no{font-size:12px;font-weight:600;color:var(--muted)}
.rate{font-weight:600;color:var(--fg)}
.rate::first-letter{color:var(--star)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--accent-soft)}

.empty{background:var(--glass-3);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* buttons */
.btn{border:1px solid transparent;border-radius:16px;padding:14px 16px;font-weight:600;font-size:15.5px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,filter .2s ease,background .2s ease}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px}
.btn-main{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 8px 22px -8px rgba(242,170,5,.75),inset 0 1px 0 rgba(255,255,255,.5)}
@media (hover:hover){.btn-main:hover{filter:brightness(1.05)}}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-ghost{background:var(--glass);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.btn-danger{background:var(--glass-3);color:var(--danger);border-color:var(--danger-bg)}
.btn-danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-main.armed{background:var(--fg);color:var(--bg);box-shadow:none}
.btn:disabled{opacity:.55}
/* centred with margins, not transform: some Telegram webviews drop fixed elements that combine transform and blur */
.fab{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:8;width:min(528px,calc(100% - 32px));background:linear-gradient(140deg,var(--accent-2),var(--accent));box-shadow:0 14px 34px -10px rgba(242,170,5,.8),inset 0 1px 0 rgba(255,255,255,.5)}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--edge);background:var(--glass);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500;box-shadow:inset 0 1px 0 var(--hi);transition:background .2s ease,color .2s ease}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.chip .cnt{opacity:.55;font-variant-numeric:tabular-nums;margin-left:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:0 14px;margin:10px 0 12px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:none;background:none;flex:1;min-width:0;padding:12px 0;font-size:16px;outline:none}
.seg{display:flex;gap:4px;padding:4px;background:var(--glass-3);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--fg);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}

/* tabbar: floating glass pill */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .wrap{display:flex;gap:2px;max-width:536px;padding:6px;pointer-events:auto;background:var(--bar);border:1px solid var(--edge);border-radius:24px;box-shadow:var(--shadow-lg),inset 0 1px 0 var(--hi)}
.tab{flex:1;border:none;background:none;padding:8px 2px 7px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative;transition:background .2s ease,color .2s ease}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--fg);background:var(--accent-soft);font-weight:600}
.tab[aria-current="true"] svg{color:var(--accent-strong);stroke-width:2.1;filter:drop-shadow(0 2px 6px rgba(242,170,5,.4))}
.tab .n{position:absolute;top:3px;left:calc(50% + 7px);background:var(--danger);color:#fff;font-size:10.5px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bar)}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:var(--mesh);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-hdr{position:sticky;top:0;background:var(--bar);z-index:2;border-bottom:1px solid var(--line)}
.sh-hdr .wrap{display:flex;align-items:center;gap:8px;padding-block:9px}
.back{border:1px solid var(--edge);background:var(--glass);border-radius:99px;display:flex;align-items:center;gap:3px;font-weight:600;padding:6px 13px 6px 8px;box-shadow:inset 0 1px 0 var(--hi)}
.back svg{width:19px;height:19px}
.sh-title{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;color:var(--muted);font-size:14px}
.sh-body{padding-block:16px 36px}

.info{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted);font-size:14px;width:118px;flex:none}
.row .v{flex:1;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 14px}
.note{background:var(--accent-soft);border:1px solid var(--accent-soft);border-radius:16px;padding:12px 14px;font-size:14px;margin:14px 0 0}
.note.good{background:var(--booked-bg);border-color:var(--booked-bg)}
.note.gray{background:var(--done-bg);border-color:var(--done-bg)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--glass-3);border:1px solid var(--edge);box-shadow:var(--shadow)}
.ph>button{all:unset;cursor:pointer;display:block;width:100%;height:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,18,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:17px;line-height:1;display:grid;place-items:center}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px dashed var(--line);background:var(--glass-3);box-shadow:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.ph.add svg{width:22px;height:22px}
.zoom{display:block;width:100%;border-radius:18px;box-shadow:var(--shadow-lg)}

/* reviews */
.stars{display:flex;gap:4px}
.stars button{border:none;background:none;font-size:38px;line-height:1;padding:2px;color:var(--line);transition:transform .12s ease,color .15s ease}
.stars button[aria-pressed="true"]{color:var(--star);text-shadow:0 2px 10px rgba(242,170,5,.45)}
.stars button:active{transform:scale(1.15)}
.review{padding:12px 16px;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:none}
.review .st{color:var(--star);letter-spacing:1px}
.review .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.review .sub{font-size:13px;color:var(--muted)}

/* forms */
form .f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label.l{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
input.i,textarea.i,select.i,div.i{width:100%;background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:13px 14px;font-size:16px;box-shadow:inset 0 1px 0 var(--hi);transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
input.i:focus,textarea.i:focus,select.i:focus{outline:none;background:var(--glass-2);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
input.i::placeholder,textarea.i::placeholder{color:var(--muted);opacity:.75}
textarea.i{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.err{color:var(--danger);font-size:14px;font-weight:500;min-height:1px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:inset 0 1px 0 var(--hi)}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent)}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--glass);border:1px solid var(--edge)!important;border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
button.tile{transition:transform .12s ease}
button.tile:active{transform:scale(.98)}
.tile .num{font-family:var(--display);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.tile .lbl{color:var(--muted);font-size:13px;margin-top:3px}
.tile.hot{background:linear-gradient(140deg,var(--hot),transparent 85%),var(--glass);border-color:var(--hot-edge)!important}
.tile.wide{grid-column:1/-1}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--glass-3);border:1px solid var(--line);margin:6px 0 8px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.list-line{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
.list-line:last-child{border-bottom:none}
.list-line .t{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

const finalOf=t=>t.finalPrice??t.price??null;
const savedOf=t=>t.price&&finalOf(t)?Math.max(0,t.price-finalOf(t)):0;
function feeFor(t){const c=S.cfg,f=finalOf(t)||0;if(c.mode==='percent')return Math.round(f*(Number(c.percent)||0)/100);return Math.round(savedOf(t)*(Number(c.share)||0)/100)}
const feeOf=t=>t.fee??feeFor(t);
const cfgText=c=>c.mode==='percent'?`${c.percent}% от цены исполнителя`:`${c.share}% от экономии заказчика`;
const offerIds=t=>(t.offerBy||[]).filter(x=>!(t.rejectedIds||[]).includes(x));
const isDeclined=(t,o)=>{const d=(t.declined||{})[o.executorId];return !!d&&d>=(o.updatedAt||o.createdAt||0)};
const liveOffers=t=>(S.offersBy[t.id]||[]).filter(o=>offerIds(t).includes(o.executorId)).sort((a,b)=>a.price-b.price);
const activeOffers=t=>liveOffers(t).filter(o=>!isDeclined(t,o));
const offerCount=t=>S.offersBy[t.id]?activeOffers(t).length:offerIds(t).length;
const myOffer=tid=>(S.offersBy[tid]||[]).find(o=>o.executorId===S.uid)||null;
function myState(t){
  if(t.executorId===S.uid)return t.status==='done'?'done':t.status==='booked'?'chosen':t.status==='cancelled'?'cancelled':'lost';
  if(!(t.offerBy||[]).includes(S.uid))return 'none';
  if(t.status==='cancelled')return 'cancelled';
  if(t.status==='open'&&!(t.rejectedIds||[]).includes(S.uid)){const o=myOffer(t.id);return o&&isDeclined(t,o)?'declined':'waiting'}
  return 'lost';
}
/* reviews: the operator sees every task, everyone else reads the public reviews collection */
function reviewsOf(id){
  if(role()==='manager')return S.tasks.filter(t=>t.executorId===id&&t.status==='done').map(t=>({id:t.id,rating:(t.review&&t.review.rating)||0,text:(t.review&&t.review.text)||'',at:(t.review&&t.review.at)||t.doneAt,category:t.category,customerName:t.customerName||nameOf(t.customerId)}));
  const c=S.reviewsBy[id];if(c&&(c==='loading'||Date.now()-c.at<12e4))return c==='loading'?null:c.list;
  if(!c)S.reviewsBy[id]='loading';
  S.db.collection('reviews').where('executorId','==',id).get()
    .then(s=>{S.reviewsBy[id]={at:Date.now(),list:s.docs.map(d=>({id:d.id,...d.data()}))};schedule()})
    .catch(e=>{console.warn(e);S.reviewsBy[id]={at:Date.now(),list:[]};schedule()});
  return c?c.list:null;
}
function statsOf(id){const r=reviewsOf(id);if(!r)return null;const rated=r.filter(x=>x.rating>0);return {done:r.length,n:rated.length,avg:rated.length?sum(rated,x=>x.rating)/rated.length:0,list:rated.sort((a,b)=>(b.at||0)-(a.at||0))}}
function rateHTML(id){const s=statsOf(id);if(!s)return '<span class="muted">…</span>';return s.n?`<span class="rate">★ ${s.avg.toFixed(1).replace('.',',')}</span> <span class="muted">· ${s.n} ${plural(s.n,'отзыв','отзыва','отзывов')}</span>`:'<span class="muted">Пока без отзывов</span>'}

/* ---------- places & distance ---------- */
const posOf=t=>t&&t.lat!=null&&t.lng!=null?{lat:t.lat,lng:t.lng}:null;
function km(a,b){if(!a||!b)return null;const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtKm=x=>x==null?'':x<1?Math.max(50,Math.round(x*1000/50)*50)+' м':(x<10?x.toFixed(1).replace('.',','):Math.round(x))+' км';
const myPos=()=>S.geo||(me()&&me().geo)||null;
const radiusOf=()=>{const r=me()&&me().radiusKm;return r==null?10:Number(r)};
const roundGeo=(p,d=4)=>({lat:Number(p.lat.toFixed(d)),lng:Number(p.lng.toFixed(d))});
function getPos(){return new Promise((res,rej)=>{
  const fallback=()=>{if(!navigator.geolocation)return rej('Геолокация недоступна на этом устройстве. Поставьте точку на карте');
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),e=>rej(e&&e.code===1?'Нет доступа к местоположению. Разрешите доступ или поставьте точку на карте':'Не удалось определить местоположение. Поставьте точку на карте'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};
  const LM=TG&&TG.LocationManager;
  if(LM&&TG.isVersionAtLeast&&TG.isVersionAtLeast('8.0')){try{LM.init(()=>{if(!LM.isLocationAvailable)return fallback();LM.getLocation(d=>d?res({lat:d.latitude,lng:d.longitude}):fallback())})}catch(e){fallback()}}
  else fallback();
})}
/* OpenStreetMap search is only a helper (it is weak for some Kazakhstan addresses): results near the current map view win, and the found name is shown so a wrong match is easy to spot */
async function geocode(q,near){
  const c=near||CITY,vb=[c.lng-.35,c.lat+.25,c.lng+.35,c.lat-.25].join(',');
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ru&viewbox=${vb}&q=`+encodeURIComponent(q));
  const j=await r.json();if(!j.length)throw 'Адрес не найден на карте. Поставьте точку вручную';
  return {lat:Number(j[0].lat),lng:Number(j[0].lon),name:String(j[0].display_name||'').split(',').slice(0,4).join(',')};

    return [a.city||a.town||a.village||a.county,a.road||a.neighbourhood||a.suburb,a.house_number].filter(Boolean).join(', ')}catch(e){return ''}

/* ---------- maps (Leaflet + OpenStreetMap, loaded only when a map is on screen) ----------
   A map's DOM node is kept in MAPS and re-attached after every re-render, so live updates don't reload tiles. */
let LP=null;const MAPS={};
function loadLeaflet(){
  if(window.L)return Promise.resolve(window.L);if(LP)return LP;
  LP=new Promise((res,rej)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';document.head.appendChild(c);
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';s.onload=()=>res(window.L);s.onerror=()=>{LP=null;rej('map')};document.head.appendChild(s)});
  return LP;
}
const mapPh=(key,h=200)=>`<div class="map" data-map="${esc(key)}" style="height:${h}px"></div>`;
const pinIcon=(cls='')=>L.divIcon({className:'',html:`<div class="pin ${cls}"></div>`,iconSize:[22,22],iconAnchor:[11,22]});
const meIcon=()=>L.divIcon({className:'',html:'<div class="pin me"></div>',iconSize:[18,18],iconAnchor:[9,9]});
const priceIcon=(txt,mine)=>L.divIcon({className:'',html:`<span class="pin-price ${mine?'mine':''}">${esc(txt)}</span>`,iconSize:[0,0]});
async function mountMaps(){
  if(!document.querySelector('[data-map]'))return;
  try{await loadLeaflet()}catch(e){document.querySelectorAll('[data-map]').forEach(p=>{if(!p.firstChild)p.innerHTML='<p class="hint" style="padding:12px">Карта не загрузилась. Проверьте интернет.</p>'});return}
  for(const ph of document.querySelectorAll('[data-map]')){
    const key=ph.dataset.map,[kind,arg]=key.split(':');let M=MAPS[key];
    if(!M){const el=document.createElement('div');el.className='map-in';M=MAPS[key]={el,map:null,layer:null,fitted:false}}
    if(ph.firstChild!==M.el){ph.innerHTML='';ph.appendChild(M.el)}
    if(!M.map){M.map=L.map(M.el,{zoomControl:false,attributionControl:true}).setView([CITY.lat,CITY.lng],11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M.map);
      L.control.zoom({position:'bottomright'}).addTo(M.map);M.layer=L.layerGroup().addTo(M.map)}
    M.map.invalidateSize(false);
    try{MAPDRAW[kind]&&MAPDRAW[kind](M,arg)}catch(e){console.warn(e)}
  }
}
/* programmatic moves never animate: a sheet can close mid-animation and Leaflet would then touch a removed map */
const NOANIM={animate:false};
function fitTo(M,pts,z=15){pts=pts.filter(Boolean);if(!pts.length)return;if(pts.length===1)M.map.setView([pts[0].lat,pts[0].lng],z,NOANIM);else M.map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36],maxZoom:16,animate:false})}
const MAPDRAW={
  task(M,id){const t=T(id),p=posOf(t);M.layer.clearLayers();if(!p)return;L.marker([p.lat,p.lng],{icon:pinIcon()}).addTo(M.layer);
    const m=role()==='executor'?myPos():null;if(m)L.marker([m.lat,m.lng],{icon:meIcon()}).addTo(M.layer);
    if(!M.fitted){fitTo(M,[p,m]);M.fitted=true}},
  feed(M){M.layer.clearLayers();const m=myPos(),pts=[];
    if(m){L.marker([m.lat,m.lng],{icon:meIcon()}).addTo(M.layer);pts.push(m);const r=radiusOf();if(r)L.circle([m.lat,m.lng],{radius:r*1000,color:'#F2B705',weight:1,fillOpacity:.06}).addTo(M.layer)}
    feedTasks().forEach(t=>{const p=posOf(t);if(!p)return;pts.push(p);L.marker([p.lat,p.lng],{icon:priceIcon(fmtPrice(t.price),myState(t)!=='none')}).on('click',()=>push({type:'detail',id:t.id})).addTo(M.layer)});
    if(!M.fitted&&pts.length){fitTo(M,pts,13);M.fitted=true}},
  pick(M){if(M.marker)return;const p=S.pick||myPos()||CITY;
    M.marker=L.marker([p.lat,p.lng],{icon:pinIcon(),draggable:true}).addTo(M.map);
    M.marker.on('dragend',()=>{const ll=M.marker.getLatLng();S.pick={lat:ll.lat,lng:ll.lng};pickNote()});
    M.map.on('click',e=>{M.marker.setLatLng(e.latlng);S.pick={lat:e.latlng.lat,lng:e.latlng.lng};pickNote()});
    M.map.setView([p.lat,p.lng],S.pick?16:12,NOANIM)},
  base(M){const p=S.pick||(me()&&me().geo);if(!M.marker){M.marker=L.marker([(p||CITY).lat,(p||CITY).lng],{icon:pinIcon(),draggable:true}).addTo(M.map);
      M.marker.on('dragend',()=>{const ll=M.marker.getLatLng();S.pick={lat:ll.lat,lng:ll.lng};drawBase(M)});
      M.map.on('click',e=>{M.marker.setLatLng(e.latlng);S.pick={lat:e.latlng.lat,lng:e.latlng.lng};drawBase(M)});
      M.map.setView([(p||CITY).lat,(p||CITY).lng],p?12:11,NOANIM)}
    drawBase(M)}
};
function drawBase(M){const p=S.pick||(me()&&me().geo),f=document.querySelector('form[data-form="profile"]'),r=f&&f.radius?Number(f.radius.value):radiusOf();
  if(M.circle){M.layer.removeLayer(M.circle);M.circle=null}if(p&&r)M.circle=L.circle([p.lat,p.lng],{radius:r*1000,color:'#F2B705',weight:1,fillOpacity:.08}).addTo(M.layer)}
function setPick(p,zoom=16){S.pick={lat:p.lat,lng:p.lng};Object.entries(MAPS).forEach(([k,M])=>{if((k.startsWith('pick:')||k.startsWith('base:'))&&M.marker){M.marker.setLatLng([p.lat,p.lng]);M.map.setView([p.lat,p.lng],zoom,NOANIM);if(k.startsWith('base:'))drawBase(M)}});pickNote(p.name)}
const pickCenter=()=>{const M=Object.entries(MAPS).find(([k])=>k.startsWith('pick:'));if(M&&M[1].map){const c=M[1].map.getCenter();return {lat:c.lat,lng:c.lng}}return S.pick||myPos()||CITY}
function pickNote(found){const n=$('#pickNote');if(n)n.innerHTML=found?`Нашли: <b>${esc(found)}</b>. Если точка не там — передвиньте её на карте.`:S.pick?`${IC.pin} Точка на карте отмечена`:'Нажмите на карту, чтобы отметить место заказа'}
function dropMaps(prefix){Object.keys(MAPS).forEach(k=>{if(k.startsWith(prefix)){try{const m=MAPS[k].map;if(m){m.stop();m.off();m.remove()}}catch(e){}delete MAPS[k]}})}

const okSrc=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
function compress(file,max=1280){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
    let d=c.toDataURL('image/jpeg',.72);if(d.length>650000)d=c.toDataURL('image/jpeg',.5);res(d)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej('Не удалось открыть фото. Выберите JPG или PNG')};
  im.src=u})}

    .catch(e=>{console.warn(e);S.photoCache[path]=[];refreshSheet()});
  return null;
}

}

/* theme: auto follows Telegram (or the OS); light/dark are forced and remembered on this device */
const THEMES={auto:['Авто','themeAuto'],light:['Светлая','sun'],dark:['Тёмная','moon']};

function applyTheme(){

/* a listener that survives the moment right after sign-in, when Firestore may still be using the previous credentials:
   on a permission or network error it re-subscribes a few times before giving up */
function live(list,make,next,quiet,tries=0){
  const uid=S.uid;let un=null,dead=false;
  const start=()=>{un=make().onSnapshot(next,e=>{console.warn(e);if(dead||S.uid!==uid)return;
    if(tries<5&&['permission-denied','unavailable','unauthenticated'].includes(e&&e.code)){tries++;setTimeout(()=>{if(!dead&&S.uid===uid)start()},600*tries)}
    else if(!quiet)onErr(e)})};
  start();list.push(()=>{dead=true;if(un)un()});
}

      h+=`<p class="note gray">Заказчик отклонил ваше предложение${mo?` за ${fmtPrice(mo.price)}`:''}. Можно предложить другую цену или время.</p>`;
      A.push(`<button class="btn btn-main" data-act="offer" data-id="${t.id}">Предложить другую цену</button>`);
      A.push(confirmBtn('wd'+t.id,'Убрать предложение','withdraw',t.id));
    }
    if(ms==='chosen'){
      h+=stageBar(t)+`<p class="note good"><b>Вас выбрали!</b> Цена: <b>${fmtPrice(fin)}</b>, оплата на месте после работы. Приходите ${fmtDate(t.execDate)}, ${esc(t.execTime)} по адресу выше. Отмечайте этапы — заказчик видит их сразу.</p>`;
      const nx=NEXT_STAGE[t.stage||'booked'];
      if(nx)A.push(`<button class="btn btn-main" data-act="stage" data-id="${t.id}" data-v="${nx[0]}">${nx[1]}</button>`);
      else h+=`<p class="note">Ждём, когда заказчик подтвердит выполнение.</p>`;
      A.push(chatBtn(t,'Чат с заказчиком'));
      A.push(supBtn(S.uid,t.id,'Написать в поддержку'));
      A.push(`<button class="btn btn-danger" data-act="reason" data-k="leave" data-id="${t.id}">Отказаться от заказа</button>`);
    }
    if(ms==='lost')h+=`<p class="note gray">Заказчик выбрал другого исполнителя. Спасибо за предложение — смотрите новые заказы рядом.</p>`;
    if(ms==='cancelled')h+=`<p class="note gray">Заказ отменён${t.cancelReason?`: ${esc(t.cancelReason)}`:''}.</p>`;
    if(ms==='done'){h+=`<p class="note gray">Заказ выполнен. Цена: <b>${fmtPrice(fin)}</b>.</p>`+reviewBlock(t);A.push(chatBtn(t,'Чат по заказу','btn-ghost'))}
  }
  if(isCust){
    if(t.status==='open'){
      h+=`<h2>Предложения мастеров · ${offerCount(t)}</h2>${offersBlock(t)}`;
      A.push(`<button class="btn btn-ghost" data-act="edit" data-id="${t.id}">Изменить заказ</button>`);
      A.push(supBtn(S.uid,t.id,'Вопрос в поддержку'));
      A.push(`<button class="btn btn-danger" data-act="reason" data-k="cancel" data-id="${t.id}">Отменить заказ</button>`);
    }
    if(t.status==='booked'){
      h+=`<p class="note">${t.stage==='finished'?'<b>Исполнитель отметил, что закончил работу.</b> Проверьте результат и подтвердите выполнение. ':''}Оплата — на месте, исполнителю, после работы. Договориться о деталях можно в чате заказа.</p>`;
      A.push(`<button class="btn ${t.stage==='finished'?'btn-main':'btn-ghost'}" data-act="done" data-id="${t.id}">Работа выполнена</button>`);
      A.push(chatBtn(t,'Чат с исполнителем',t.stage==='finished'?'btn-ghost':'btn-dark'));
      A.push(supBtn(S.uid,t.id,'Написать в поддержку'));
      A.push(`<button class="btn btn-danger" data-act="reason" data-k="unbook" data-id="${t.id}">Выбрать другого исполнителя</button>`);
      A.push(`<button class="btn btn-danger" data-act="reason" data-k="cancel" data-id="${t.id}">Отменить заказ</button>`);
    }
    if(t.status==='done'){h+=reviewBlock(t);if(!t.review&&t.executorId)A.push(`<button class="btn btn-main" data-act="review" data-id="${t.id}">Оценить работу</button>`);A.push(chatBtn(t,'Чат по заказу','btn-ghost'))}
    if(t.status==='cancelled'&&t.cancelReason)h+=`<p class="note gray">Причина отмены: ${esc(t.cancelReason)}</p>`;
  }
  if(isMgr)h+=mgrDetail(t,A);
  if(A.length)h+=`<div class="actions">${A.join('')}</div>`;
  return h+`</div>`;
}
function mgrDetail(t,A){
  let h='';
  if((t.offerBy||[]).length){
    const os=(S.offersBy[t.id]||[]).slice().sort((a,b)=>a.price-b.price),rej=t.rejectedIds||[];
    h+=`<h2>Предложения · ${(t.offerBy||[]).length}</h2>`+(S.offersBy[t.id]?`<div class="info">${os.map(o=>`<div class="list-line" data-act="person" data-id="${o.executorId}" data-t="${t.id}" style="cursor:pointer"><span><b>${esc(nameOf(o.executorId))}</b>${o.executorId===t.executorId?' <span class="badge-ok">выбран</span>':rej.includes(o.executorId)?' <span class="badge-no">снят</span>':isDeclined(t,o)?' <span class="badge-no">отклонён</span>':''}${o.km!=null?` <span class="muted">· ${fmtKm(o.km)}</span>`:''}${o.comment?`<br><span class="muted">${esc(o.comment)}</span>`:''}</span><span class="t">${fmtPrice(o.price)}</span></div>`).join('')||'<div class="list-line muted">Предложения отозваны</div>'}</div>`:'<p class="hint">Загружаем предложения…</p>');
  }
  h+=reviewBlock(t);
  if(t.cancelReason)h+=`<p class="note gray">Причина отмены: ${esc(t.cancelReason)}</p>`;
  const ev=S.evBy['taskId|'+t.id];
  h+=`<h2>Хронология</h2>`+(ev?ev.length?`<div class="info">${ev.map(evRow).join('')}</div>`:'<p class="hint">Событий пока нет (заказы до v3 без хронологии).</p>':'<p class="hint">Загружаем…</p>');
  A.push(`<button class="btn ${t.checked?'btn-ghost':'btn-main'}" data-act="check" data-id="${t.id}">${t.checked?'✓ Проверено (снять отметку)':'Отметить как проверенное'}</button>`);
  if(t.status==='open'||t.status==='booked')A.push(`<button class="btn btn-dark" data-act="assign" data-id="${t.id}">${IC.users}${t.status==='booked'?'Заменить исполнителя':'Подобрать и назначить исполнителя'}</button>`);
  if(t.executorId)A.push(chatBtn(t,'Чат заказа (заказчик ↔ исполнитель)','btn-ghost'));
  A.push(supBtn(t.customerId,t.id,'Написать заказчику'));
  if(t.executorId)A.push(supBtn(t.executorId,t.id,'Написать исполнителю'));
  A.push(`<button class="btn btn-ghost" data-act="edit" data-id="${t.id}">Исправить заказ</button>`);
  if(t.status==='booked'){A.push(confirmBtn('mdone'+t.id,'Отметить выполненным','mgrdone',t.id,'btn-ghost'));A.push(confirmBtn('rej'+t.id,'Снять исполнителя','mgrunbook',t.id))}
  if(t.status==='cancelled'||t.status==='done')A.push(confirmBtn('reopen'+t.id,'Вернуть в «Ждёт предложений»','mgrreopen',t.id,'btn-ghost'));
  if(t.status==='open'||t.status==='booked')A.push(`<button class="btn btn-danger" data-act="reason" data-k="mgrcancel" data-id="${t.id}">Снять заказ</button>`);
  return h;
}

/* operator: pick an executor for a task — best matches first (specialty, distance, rating) */
function assignHTML(s){
  const t=T(s.id);if(!t)return shHead('Назад');
  const pos=posOf(t),q=(s.q||'').toLowerCase(),offers=S.offersBy[t.id]||[];
  let ps=Object.values(S.profiles).filter(p=>p.role==='executor'&&!p.blocked&&!(t.rejectedIds||[]).includes(p.id));
  if(q)ps=ps.filter(p=>[p.name,(p.specialties||[]).join(' '),phoneOf(p.id)].join(' ').toLowerCase().includes(q));
  const score=p=>{const o=offers.find(x=>x.executorId===p.id),d=km(p.geo,pos),st=statsOf(p.id);return [o?0:1,(p.specialties||[]).includes(t.category)?0:1,d==null?999:d,-(st&&st.avg||0)]};
  ps.sort((a,b)=>{const x=score(a),y=score(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0});
  const sel=s.sel?P(s.sel):null,so=sel&&offers.find(x=>x.executorId===sel.id);
  return shHead('Назад','Назначить исполнителя')+`<div class="wrap sh-body"><h1>Назначить исполнителя</h1><p class="lead">${esc(t.title)} · ${esc(t.category)} · цена заказчика ${fmtPrice(t.price)}. Сверху — кто уже предложил цену, затем подходящие по специальности и ближе к заказу.</p>
  ${sel?`<form data-form="assign" data-id="${t.id}" data-e="${sel.id}" novalidate class="info" style="padding:14px;margin-bottom:14px">
     <b>${esc(sel.name)}</b>${verBadge(sel.id)}<div class="kv" style="margin:4px 0 10px">${esc(phoneOf(sel.id)||'')}${so?` · предложил ${fmtPrice(so.price)}`:''}</div>
     <div class="two"><div class="f"><label class="l" for="a-price">Цена, ₸</label><input class="i" type="number" id="a-price" name="price" value="${esc(so?so.price:t.price)}"></div>
     <div class="f"><label class="l" for="a-date">Дата</label><input class="i" type="date" id="a-date" name="date" value="${esc(so&&so.date||t.date)}"></div></div>
     <div class="f"><label class="l" for="a-time">Время</label><input class="i" type="time" id="a-time" name="time" value="${esc(so&&so.time||t.time)}"></div>
     <p class="err" id="formErr"></p><button class="btn btn-main" type="submit">Назначить ${esc(firstName(sel.name))}</button>
     <button type="button" class="btn btn-ghost" style="margin-top:8px" data-act="support" data-uid="${sel.id}" data-t="${t.id}">${IC.chat}Сначала спросить в поддержке</button></form>`:''}
  <div class="search searchrow">${IC.search}<input id="asSearch" type="search" placeholder="Поиск: имя, специальность, телефон" value="${esc(s.q||'')}" autocomplete="off"></div>
  <div class="stack" id="asList">${ps.slice(0,80).map(p=>{const o=offers.find(x=>x.executorId===p.id),d=km(p.geo,pos);
    return `<button class="card ${s.sel===p.id?'sel':''}" data-act="assignpick" data-id="${t.id}" data-e="${p.id}"><div class="prow"><span class="ava ${isOnline(p)?'on':''}">${esc((p.name||'?').charAt(0))}</span><span class="pbody">
     <span class="card-top"><span class="nm">${esc(p.name)}${verBadge(p.id)}</span>${o?`<span class="price">${fmtPrice(o.price)}</span>`:''}</span>
     <span class="kv">${esc((p.specialties||[]).join(', ')||'—')}${d!=null?` · <b>${fmtKm(d)}</b>`:''} · ${isOnline(p)?'<b>онлайн</b>':ago(p.lastSeen)}</span><span class="kv">${rateHTML(p.id)}</span></span></div></button>`}).join('')||empty('Никого не найдено','')}</div></div>`;
}

function taskMsgsHTML(tid){
  const t=T(tid),ms=S.chat.by[tid],r=role();
  let h=`<div class="wrap"><div class="sys">${r==='manager'?`${esc(t.customerName||nameOf(t.customerId))} (заказчик) и ${esc(nameOf(t.executorId,'исполнитель'))} (исполнитель)`:'Договоритесь о деталях здесь. Оператор Барнабаса видит этот чат и поможет, если что-то пойдёт не так. Не переводите предоплату незнакомым людям.'}</div>`;
  if(!ms)return h+'<div class="sys">Загружаем…</div></div>';
  if(!ms.length)h+=`<div class="sys">Сообщений пока нет.</div>`;
  h+=ms.map(m=>{const mine=m.authorId===S.uid,op=m.authorId!==t.customerId&&m.authorId!==t.executorId;
    const who=mine?'':op?'Оператор Барнабас':m.authorId===t.customerId?esc(t.customerName||nameOf(m.authorId))+(r==='manager'?' · заказчик':''):esc(nameOf(m.authorId))+(r==='manager'?' · исполнитель':'');
    return `<div class="msg ${mine?'mine':''}">${who?`<div class="who">${who}</div>`:''}<div class="tx">${esc(m.text)}</div><div class="tm">${fmtStamp(m.createdAt)}</div></div>`}).join('');
  return h+`</div>`;
}

async function writeOffer(t,{price,comment,date,time}){
  const mo=myOffer(t.id),tr=S.db.collection('tasks').doc(t.id),b=S.db.batch(),d=km(myPos(),posOf(t));
  b.set(tr.collection('offers').doc(S.uid),{executorId:S.uid,price,comment,date,time,km:d==null?null:Math.round(d*10)/10,createdAt:mo?mo.createdAt:Date.now(),updatedAt:Date.now()});
  if(!(t.offerBy||[]).includes(S.uid))b.update(tr,{offerBy:FV().arrayUnion(S.uid)});
  await b.commit();return mo;
}
function clashOf(id,date,time){const ms=toMs(date,time);return S.tasks.find(x=>x.id!==id&&x.status==='booked'&&x.executorId===S.uid&&Math.abs(toMs(x.execDate,x.execTime)-ms)<2*36e5)}

document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.name==='mode'){const o=$('#ownTime');if(o)o.hidden=el.value!=='mine';return}
  const k=el.dataset&&el.dataset.photos;if(!k||!el.files||!el.files.length)return;
  const files=[...el.files];el.value='';
  if(k==='works'){
    const path='profiles/'+S.uid+'/works',have=Array.isArray(S.photoCache[path])?S.photoCache[path].length:0,list=files.slice(0,MAXPH.works-have);
    if(list.length<files.length)toast(`Можно добавить не больше ${MAXPH.works} фото`,true);
    toast('Загружаем фото…');
    try{const srcs=[];for(const f of list)srcs.push(await compress(f));await uploadPhotos(path,srcs);delete S.photoCache[path];refreshSheet();toast('Фото добавлены')}catch(x){console.warn(x);toast(errText(x),true)}
    return;
  }
  const arr=S.drafts[k]||(S.drafts[k]=[]),list=files.slice(0,MAXPH[k]-arr.length);
  if(list.length<files.length)toast(`Можно добавить не больше ${MAXPH[k]} фото`,true);
  for(const f of list){try{arr.push(await compress(f))}catch(x){toast(errText(x),true)}}
  renderDraft(k);
});

const expVal=v=>v===''?null:Math.max(0,Math.min(70,Math.round(Number(v))));
const FORMS={
  async login(f){
    const d=phoneDigits(f.phone.value),pw=f.pw.value;
    if(!d)throw 'Введите номер телефона полностью, например +7 700 123 45 67';
    if(!pw)throw 'Введите пароль';
    try{await S.auth.signInWithEmailAndPassword(emailOf(d),pw)}catch(e){throw authErr(e)}
    setTimeout(()=>logEv('login'),1500);
  },
  async register(f){
    const name=f.name.value.trim(),d=phoneDigits(f.phone.value),r=S.reg.role,pw=f.pw.value,mk=f.pass.value;
    const specs=[...f.querySelectorAll('[data-act="regspec"][aria-pressed="true"]')].map(b=>b.dataset.c);
    const experience=expVal(f.experience.value),about=f.about.value.trim();
    if(!r)throw 'Выберите, кто вы: заказчик или мастер';
    if(!name)throw r==='executor'?'Укажите ФИО':'Укажите имя';
    if(!d)throw 'Введите номер телефона полностью, например +7 700 123 45 67';
    if(pw.length<6)throw 'Пароль должен быть не короче 6 символов';
    if(pw!==f.pw2.value)throw 'Пароли не совпадают';
    if(r==='executor'){
      if(name.split(/\s+/).length<2)throw 'Укажите ФИО полностью: фамилию и имя';
      if(!specs.length)throw 'Выберите хотя бы одну специальность';
      if(experience==null||isNaN(experience))throw 'Укажите стаж в годах (0, если меньше года)';
      if(about.length<20)throw 'Расскажите о себе хотя бы в паре предложений';
    }
    if(r==='manager'){if(!mk)throw 'Введите пароль оператора';if(mk.includes('/')||!(await keyExists(mk)))throw 'Неверный пароль оператора'}
    S.registering=true;
    try{
      try{await S.auth.createUserWithEmailAndPassword(emailOf(d),pw)}catch(e){throw authErr(e)}
      const uid=S.auth.currentUser.uid;S.uid=uid;S.afterFor=uid;
      const ex=r==='executor',u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
      await S.db.collection('private').doc(uid).set({phone:fmtPhone(d),...(u?{tgId:u.id,tgUser:u.username||'',tgName:[u.first_name,u.last_name].filter(Boolean).join(' '),tgAt:Date.now()}:{})});
      S.privs[uid]={phone:fmtPhone(d)};
      const prof={name,role:r,specialties:ex?specs:[],experience:ex?experience:null,about:ex?about:'',verified:false,createdAt:Date.now(),lastSeen:Date.now(),...(ex&&S.reg.geo?{geo:S.reg.geo,radiusKm:10}:{})};
      await S.db.collection('profiles').doc(uid).set(prof);
      S.profiles[uid]={id:uid,...prof};S.ready.me=true;subMe();
      logEv('register',{name,role:r,text:ROLE[r]+(ex?' · '+specs.join(', '):'')});
    }finally{S.registering=false}
    /* the profile exists now, so the app can open; photos and operator rights follow without blocking the screen */
    const uid=S.uid,photos=S.drafts.reg||[];S.tab=null;S.drafts.reg=[];schedule();toast('Добро пожаловать в Барнабас!');
    if(r==='executor'&&photos.length){try{await uploadPhotos('profiles/'+uid+'/works',photos)}catch(e){console.warn(e);toast('Анкета сохранена, но фото не загрузились. Добавьте их в профиле',true)}}
    if(r==='manager'){await S.db.collection('managers').doc(uid).set({key:mk,at:Date.now()});await loadMgr();syncRoleSubs();schedule()}
  },
  async chpass(f){
    const old=f.old.value,nw=f.nw.value;
    if(nw.length<6)throw 'Новый пароль должен быть не короче 6 символов';
    const u=S.auth.currentUser;
    try{await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,old))}catch(e){throw 'Текущий пароль неверный'}
    try{await u.updatePassword(nw)}catch(e){throw authErr(e)}
    f.old.value='';f.nw.value='';toast('Пароль изменён');
  },
  async profile(f){
    const name=f.name.value.trim(),r=f.role.value,was=role();
    const specs=[...f.querySelectorAll('[data-act="pickspec"][aria-pressed="true"]')].map(b=>b.dataset.c);
    if(!name)throw 'Укажите имя';
    const upd={name,role:r,specialties:specs};
    if(r==='executor'){
      if(!specs.length)throw 'Выберите хотя бы одну специальность';
      const e=expVal(f.experience.value);if(e!=null&&isNaN(e))throw 'Стаж — это число лет';
      upd.experience=e;upd.about=f.about.value.trim();upd.radiusKm=Number(f.radius.value)||0;
      if(S.pick)upd.geo=roundGeo(S.pick,2);
    }
    if(r==='manager'&&role()!=='manager')await becomeManager(f.pass.value);
    await S.db.collection('profiles').doc(S.uid).update(upd);
    if(was!==r)logEv('role',{text:`${ROLE[was]} → ${ROLE[r]}`});else logEv('profile',{text:r==='executor'?specs.join(', '):''});
    S.tab=null;S.taskRole=null;pop();syncRoleSubs();schedule();toast('Профиль сохранён');
  },
  async task(f){
    const id=f.dataset.id,t=id?T(id):null,mgr=role()==='manager';
    const d={category:f.category.value,title:f.title.value.trim(),description:f.description.value.trim(),address:f.address.value.trim(),date:f.date.value,time:f.time.value,price:f.price.value?Math.round(Number(f.price.value)):null};
    const flat=f.flat.value.trim();
    if(!d.category)throw 'Выберите услугу: сантехник, электрик…';
    if(!d.title)throw 'Напишите, что нужно сделать';
    if(!d.address)throw 'Укажите адрес';
    if(!d.date||!d.time)throw 'Укажите дату и время';
    if(!id&&toMs(d.date,d.time)<Date.now()-15*6e4)throw 'Дата и время уже прошли. Выберите время в будущем';
    if(!(d.price>0))throw 'Укажите вашу цену — сколько вы готовы заплатить';
    if(S.pick){d.lat=Number(S.pick.lat.toFixed(5));d.lng=Number(S.pick.lng.toFixed(5))}
    else if(!id)throw 'Отметьте место заказа на карте — так мастера рядом увидят расстояние'
    if(id){
      await S.db.doc('tasks/'+id).update(mgr?{...d,editedByManager:true,checked:true}:d);
      if(flat!==((S.secret[id]||{}).flat||''))await S.db.doc(`tasks/${id}/secret/addr`).set({flat});S.secret[id]={flat};
      if(mgr)mgrEv(`Исправил заказ ${tq({title:d.title})}`,{taskId:id});else logEv(d.price!==t.price?'price_up':'task_edit',{taskId:id,text:(d.price!==t.price?`${fmtPrice(t.price)} → ${fmtPrice(d.price)} · `:'')+tq({title:d.title})});
      pop();toast('Изменения сохранены');return;
    }
    const ph=S.drafts.task||[];
    const ref=await S.db.collection('tasks').add({...d,customerId:S.uid,customerName:me().name||'',status:'open',executorId:null,checked:false,offerBy:[],rejectedIds:[],declined:{},photoCount:ph.length,createdAt:Date.now()});
    if(flat)await ref.collection('secret').doc('addr').set({flat});
    logEv('task_new',{taskId:ref.id,text:`${d.category} · ${fmtPrice(d.price)} · ${tq(d)}`});
    pop();S.tab='my';renderAll();toast('Заказ опубликован. Мастера рядом уже видят его');
    if(ph.length){try{await uploadPhotos('tasks/'+ref.id+'/photos',ph)}catch(e){console.warn(e);toast('Заказ опубликован, но фото не загрузились',true)}}
    S.drafts.task=[];S.pick=null;
  },
  async offer(f){
    const id=f.dataset.id,t=T(id);if(!t||t.status!=='open')throw 'Этот заказ уже не принимает предложения';
    const price=Math.round(Number(f.price.value)),own=f.mode.value==='mine';
    if(!(price>0))throw 'Укажите вашу цену';
    const date=own?f.date.value:t.date,time=own?f.time.value:t.time;
    if(!date||!time)throw 'Укажите дату и время';
    if(toMs(date,time)<Date.now())throw 'Это время уже прошло. Выберите другое';
    const c=clashOf(id,date,time);if(c)throw `На это время у вас уже есть заказ «${c.title}» (${fmtDate(c.execDate)}, ${c.execTime}). Выберите другое время.`;
    const mo=await writeOffer(t,{price,comment:f.comment.value.trim(),date,time});
    logEv(mo?'offer_edit':'offer',{taskId:id,text:`${fmtPrice(price)}${own?` на ${fmtDate(date)}, ${time}`:''} · ${tq(t)}`});
    S.stack=[{type:'detail',id}];buildSheet();syncLive();toast(mo?'Предложение обновлено':'Предложение отправлено заказчику');
  },
  async review(f){
    const rating=Number(f.rating.value),text=f.text.value.trim(),id=f.dataset.id,t=T(id);if(!rating)throw 'Поставьте оценку от 1 до 5 звёзд';
    await S.db.doc('tasks/'+id).update({review:{rating,text,at:Date.now()}});
    await S.db.doc('reviews/'+id).set({executorId:t.executorId,customerId:S.uid,rating,text,category:t.category||'',customerName:me().name||'',at:Date.now()},{merge:true}).catch(async()=>{await S.db.doc('reviews/'+id).update({rating,text,at:Date.now()})});
    logEv('review',{taskId:id,targetId:t.executorId,text:`${starsText(rating)} ${text.slice(0,120)}`});
    delete S.reviewsBy[t.executorId];pop();if(top_()&&top_().type==='review')pop();toast('Спасибо за отзыв!');
  },
  async reason(f){
    const k=f.dataset.k,id=f.dataset.id,t=T(id),why=[f.why.value,f.note.value.trim()].filter(Boolean).join('. ');
    if(k==='cancel'){await S.db.doc('tasks/'+id).update({status:'cancelled',cancelledAt:Date.now(),cancelReason:why});logEv('task_cancel',{taskId:id,text:`${why} · ${tq(t)}`});pop();toast('Заказ отменён');return}
    if(k==='unbook'){await S.db.doc('tasks/'+id).update({...unbook,rejectedIds:FV().arrayUnion(t.executorId)});logEv('unbook',{taskId:id,targetId:t.executorId,text:`${nameOf(t.executorId)}: ${why} · ${tq(t)}`});pop();toast('Заказ снова ждёт предложений — выберите другого исполнителя');return}
    if(k==='leave'){await S.db.doc('tasks/'+id).update({...unbook,rejectedIds:FV().arrayUnion(S.uid)});logEv('leave',{taskId:id,text:`${why} · ${tq(t)}`});S.stack=[];buildSheet();syncLive();toast('Вы отказались от заказа');return}
    if(k==='mgrcancel'){await S.db.doc('tasks/'+id).update({status:'cancelled',cancelledAt:Date.now(),cancelReason:'Снят оператором: '+why});mgrEv(`Снял заказ: ${why} ${tq(t)}`,{taskId:id});pop();toast('Заказ снят');return}
  },
  async assign(f){
    const id=f.dataset.id,e=f.dataset.e,t=T(id),price=Math.round(Number(f.price.value));
    if(!(price>0))throw 'Укажите цену';if(!f.date.value||!f.time.value)throw 'Укажите дату и время';
    await S.db.doc('tasks/'+id).update({status:'booked',executorId:e,finalPrice:price,execDate:f.date.value,execTime:f.time.value,bookedAt:Date.now(),stage:null,assignedByMgr:true,checked:true});
    mgrEv(`Назначил ${nameOf(e)} за ${fmtPrice(price)} ${tq(t)}`,{taskId:id,targetId:e});
    S.stack=[{type:'detail',id}];buildSheet();syncLive();toast('Исполнитель назначен');
  },
  async money(f){
    const mode=f.fmode.value,share=Number(f.share.value),percent=Number(f.percent.value);
    if(!(share>=0&&share<=100&&percent>=0&&percent<=100))throw 'Проценты — от 0 до 100';
    await S.db.collection('config').doc('money').set({mode,share,percent,updatedAt:Date.now()});
    mgrEv('Изменил условия дохода: '+cfgText({mode,share,percent}));
    pop();toast('Условия сохранены');
  },
  async support(f){
    const text=f.text.value.trim();if(!text)return;
    const uid=f.dataset.uid,now=Date.now(),ref=S.db.collection('support').doc(uid),tid=f.dataset.t||null;
    f.text.value='';f.text.style.height='46px';
    await ref.collection('messages').add({authorId:S.uid,text,taskId:tid,createdAt:now});
    await ref.set({lastAt:now,lastText:text.slice(0,140),lastFrom:S.uid},{merge:true});
    if(role()==='manager')mgrEv(`Ответил в поддержке ${nameOf(uid)}: ${text.slice(0,120)}`,{targetId:uid,taskId:tid});else logEv('support',{taskId:tid,text:text.slice(0,200)});
    scrollChat();f.text.focus();
  },
  async tchat(f){
    const text=f.text.value.trim();if(!text)return;const id=f.dataset.id,now=Date.now(),t=T(id);
    f.text.value='';f.text.style.height='46px';
    await S.db.collection('tasks').doc(id).collection('messages').add({authorId:S.uid,text,createdAt:now});
    /* only the time and author go on the task (losing bidders can read it); the text stays in the chat */
    await S.db.doc('tasks/'+id).update({lastMsgAt:now,lastMsgFrom:S.uid});
    if(role()==='manager')mgrEv(`Написал в чат заказа: ${text.slice(0,120)}`,{taskId:id});else logEv('chat',{taskId:id,text:`${text.slice(0,160)} · ${tq(t)}`});
    markChatSeen(id);scrollChat();f.text.focus();
  }
};
document.addEventListener('submit',async e=>{
  const f=e.target,k=f.dataset.form;if(!FORMS[k])return;e.preventDefault();
  const btn=f.querySelector('[type=submit]'),err=f.querySelector('#formErr');if(err)err.textContent='';
  if(btn)btn.disabled=true;
  try{await FORMS[k](f)}catch(x){console.warn(x);const m=errText(x);if(err&&err.isConnected)err.textContent=m;else toast(m,true)}
  finally{if(btn&&btn.isConnected)btn.disabled=false}
});

boot();
</script>
</body>
</html>
